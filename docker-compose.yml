services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: areas_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      # roda automaticamente na PRIMEIRA vez que o banco é criado
      - ./src/banco/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/banco/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d areas_db"]
      interval: 3s
      retries: 20

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/areas_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
